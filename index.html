<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <nav>
      <h1 class="logo">weather<span class="accent">.</span></h1>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">☀️</button>
    </nav>

    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search city..." autocomplete="off">
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div id="loading" class="hidden">Loading</div>
    <div id="error" class="hidden"></div>

    <section id="current-weather" class="hidden card fade-in">
      <div class="current-header">
        <h2 id="city-name"></h2>
        <p id="weather-description"></p>
      </div>
      <div class="current-body">
        <div class="temp-block">
          <img id="weather-icon" alt="">
          <span id="temperature"></span>
        </div>
        <div class="details">
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <strong id="humidity"></strong>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind</span>
            <strong id="wind-speed"></strong>
          </div>
        </div>
      </div>
    </section>

    <section id="forecast" class="hidden">
      <h3 class="section-title">5‑Day Forecast</h3>
      <div id="forecast-cards"></div>
    </section>

    <footer>
      <a href="https://github.com/AjRyanx/Weather_APP" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
